<div class="exportar">
  <button
    type="button"
    class="button-secondary exportar-boton"
    aria-haspopup="menu"
    [attr.aria-expanded]="abierto()"
    [disabled]="descargando() !== null"
    (click)="alternar()"
  >
    <app-icono nombre="documentos" [tamano]="14" />
    <span>{{ descargando() ? 'Generando…' : etiqueta() }}</span>
    <app-icono nombre="chevron-abajo" [tamano]="14" />
  </button>

  @if (abierto()) {
    <div class="menu" role="menu" aria-label="Formatos de exportación">
      <p class="menu-titulo" role="presentation">Esta {{ alcance() }}</p>
      @if (permite('json')) {
        <button
          type="button"
          role="menuitem"
          [attr.aria-label]="'Exportar esta ' + alcance() + ' en JSON'"
          (click)="descargar('json')"
        >
          JSON
          <small>Datos estructurados (.json)</small>
        </button>
      }
      @if (permite('excel')) {
        <button
          type="button"
          role="menuitem"
          [attr.aria-label]="'Exportar esta ' + alcance() + ' en Excel'"
          (click)="descargar('excel')"
        >
          Excel
          <small>Hoja de cálculo (.xlsx)</small>
        </button>
      }
      @if (permite('pdf')) {
        <button
          type="button"
          role="menuitem"
          [attr.aria-label]="'Exportar esta ' + alcance() + ' en PDF'"
          (click)="descargar('pdf')"
        >
          PDF
          <small>Tabla imprimible (.pdf)</small>
        </button>
      }

      <div class="menu-separador" role="separator"></div>

      <p class="menu-titulo" role="presentation">Base completa</p>
      @if (permite('json')) {
        <button
          type="button"
          role="menuitem"
          aria-label="Exportar la base completa en JSON"
          (click)="descargar('json', 'base')"
        >
          JSON
          <small>Todas las entidades (.json)</small>
        </button>
      }
      @if (permite('excel')) {
        <button
          type="button"
          role="menuitem"
          aria-label="Exportar la base completa en Excel"
          (click)="descargar('excel', 'base')"
        >
          Excel
          <small>Una hoja por entidad (.xlsx)</small>
        </button>
      }
      @if (permite('pdf')) {
        <button
          type="button"
          role="menuitem"
          aria-label="Exportar la base completa en PDF"
          (click)="descargar('pdf', 'base')"
        >
          PDF
          <small>Respaldo imprimible (.pdf)</small>
        </button>
      }
    </div>
  }
</div>
