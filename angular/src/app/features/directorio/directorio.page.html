<section class="view-body" aria-labelledby="titulo-directorio">
  <header class="view-head">
    <h1 id="titulo-directorio">Directorios</h1>
  </header>

  <div class="directorio-grid">
    @for (acceso of accesos; track acceso.ruta) {
    <a
      class="directorio-card"
      [routerLink]="acceso.ruta"
      [attr.aria-label]="'Abrir el directorio de ' + acceso.etiqueta"
    >
      <span class="directorio-icono">
        <app-icono [nombre]="acceso.icono" [tamano]="22" />
      </span>
      <span class="directorio-copy">
        <strong>{{ acceso.etiqueta }}</strong>
        <span>{{ acceso.descripcion }}</span>
      </span>
      <span class="directorio-boton">
        Abrir matriz
        <app-icono nombre="chevron-derecha" [tamano]="13" />
      </span>
    </a>
    }
  </div>
</section>
