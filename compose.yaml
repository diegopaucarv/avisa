# =============================================================================
#  AVISA / OAIPCS · PostgreSQL 16 (pgvector + PostGIS)
#
#  Uso:
#    cp .env.example .env        # y ajustar POSTGRES_PASSWORD
#    ./scripts/db.sh up          # build + arranque + verificación
#
#  El esquema NO se monta como volumen de datos: el volumen `avisa_pgdata`
#  guarda el cluster. Los scripts de inicialización sólo corren cuando el
#  volumen está vacío (primer arranque o `./scripts/db.sh reset`).
# =============================================================================
name: avisa

services:
  db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: avisa/postgres:16
    container_name: avisa-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avisa}
      POSTGRES_USER: ${POSTGRES_USER:-avisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      # Colación determinista: los textos del legado son español con acentos y
      # el cargador no debe depender del locale del host.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: ${TZ:-America/Lima}
      PGTZ: ${TZ:-America/Lima}

    ports:
      # 55433 en el host: 5432 puede estar ocupado por un PostgreSQL local y
      # 55432 ya lo usa el contenedor de pruebas `avisa-v9-test`.
      - "${POSTGRES_PORT:-55433}:5432"

    volumes:
      - avisa_pgdata:/var/lib/postgresql/data

      # Scripts de inicialización (00 extensiones, 10 esquema, 20 verificación).
      - type: bind
        source: ./docker/postgres/initdb
        target: /docker-entrypoint-initdb.d
        read_only: true

      # DDL y parches: se montan con nombres limpios para que la aplicación del
      # esquema no dependa de rutas con espacios ni paréntesis. Siempre es la
      # copia del repositorio, nunca una copia divergente.
      #
      # El DDL vive en `backups/backend/`: la carpeta `backend/` de la raíz no
      # existe, y montarla abortaba el arranque con "not a directory: Are you
      # trying to mount a directory onto a file".
      - type: bind
        source: "./backups/backend/PRODUCE_OAIPCS_AVISA_v9_ddl(1).sql"
        target: /opt/avisa/sql/90_ddl_v9.sql
        read_only: true
      - type: bind
        source: ./docs/PREPARACION_V9_CARGA_LEGADO.sql
        target: /opt/avisa/sql/91_patch_01.sql
        read_only: true
      - type: bind
        source: ./docs/PREPARACION_V9_CARGA_LEGADO_2.sql
        target: /opt/avisa/sql/92_patch_02.sql
        read_only: true
      - type: bind
        source: ./docs/PREPARACION_V9_CARGA_LEGADO_3.sql
        target: /opt/avisa/sql/93_patch_03.sql
        read_only: true
      - type: bind
        source: ./docs/PREPARACION_V9_CARGA_LEGADO_4.sql
        target: /opt/avisa/sql/94_patch_04.sql
        read_only: true
      - type: bind
        source: ./docs/PREPARACION_V9_CARGA_LEGADO_5.sql
        target: /opt/avisa/sql/95_patch_05.sql
        read_only: true

      # Parches 6–24: se montan pero NO los aplica el initdb. Dependen de datos que
      # sólo existen después de la carga (documentos `RED-%`, tablas `legacy.*`), así
      # que se ejecutan a mano: ver docs/06_operacion/ENTORNO_DOCKER_POSTGRES.md §9.
      - type: bind
        source: ./docs/PARCHE_6_CIERRE_CUMPLIMIENTO.sql
        target: /opt/avisa/sql/96_patch_06.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_7_GUARDRAILS_G19_G25.sql
        target: /opt/avisa/sql/97_patch_07.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_8_ICD_TOPE_Q40.sql
        target: /opt/avisa/sql/98_patch_08.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_9_SEGURIDAD_NIVEL_ALTO.sql
        target: /opt/avisa/sql/99_patch_09.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_10_FLUJO_PROCESO_D17.sql
        target: /opt/avisa/sql/100_patch_10.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_11_GRAFO_KAG.sql
        target: /opt/avisa/sql/101_patch_11.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_12_COMENTARIOS_COLUMNAS.sql
        target: /opt/avisa/sql/102_patch_12.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_13_CLASIFICACION.sql
        target: /opt/avisa/sql/103_patch_13.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_14_CIERRE_ERS.sql
        target: /opt/avisa/sql/104_patch_14.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_15_ROLES_Y_BORRADO.sql
        target: /opt/avisa/sql/105_patch_15.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_16_RLS_CORE_Y_DC04.sql
        target: /opt/avisa/sql/106_patch_16.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_17_RENIEC_Y_COSTOS.sql
        target: /opt/avisa/sql/107_patch_17.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_18_COSTOS_Y_RLS_ADMIN.sql
        target: /opt/avisa/sql/108_patch_18.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_19_COMENTARIOS_FALTANTES.sql
        target: /opt/avisa/sql/109_patch_19.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_20_FLUJO_ALERTA.sql
        target: /opt/avisa/sql/110_patch_20.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_21_DIRECCION_Y_FLUJO.sql
        target: /opt/avisa/sql/111_patch_21.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_22_VISIBILIDAD_Y_G21.sql
        target: /opt/avisa/sql/112_patch_22.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_23_DESTINATARIOS_Y_CUATRO_OJOS.sql
        target: /opt/avisa/sql/113_patch_23.sql
        read_only: true
      - type: bind
        source: ./docs/PARCHE_24_COMENTARIOS_DESTINATARIO.sql
        target: /opt/avisa/sql/114_patch_24.sql
        read_only: true

    healthcheck:
      # -h 127.0.0.1 es imprescindible: sin host, pg_isready usa el socket Unix,
      # y el servidor temporal del initdb TAMBIÉN escucha por ese socket. Con el
      # socket el contenedor se declara healthy mientras el esquema aún se está
      # aplicando. El initdb arranca el servidor temporal con listen_addresses
      # vacío, así que el sondeo por TCP sólo responde cuando el esquema terminó.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

    shm_size: 256mb

    command:
      - postgres
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - log_min_duration_statement=1000

  # ===========================================================================
  #  UI + API · Next.js 16 en modo desarrollo
  #
  #  Sirve la API (`/api/**`) y la consola Angular, que Next publica desde
  #  `public/`. La consola se compila en el host —no en la imagen— porque el
  #  montaje `.:/app` tapa lo que la imagen traiga en `public/`:
  #
  #      npm --prefix angular ci      # una vez
  #      pnpm build:spa               # cada cambio de la consola
  #      docker compose up -d
  #
  #  Para desarrollar la consola con recarga rápida, `npm --prefix angular
  #  start` la levanta en :4200 con `proxy.conf.json` hacia esta API en :3000.
  #
  #  El código entra por un montaje desde el disco y los dos volúmenes evitan
  #  que ese montaje tape `node_modules` y `.next`. Docker siembra
  #  `avisa_node_modules` la primera vez con las dependencias que ya trae la
  #  imagen, así que no se reinstala en cada arranque.
  #
  #  Si cambia package.json:  docker compose build ui
  #  y, si el volumen ya existía:  docker volume rm avisa_node_modules
  # ===========================================================================
  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    image: avisa/ui:dev
    container_name: avisa-ui
    restart: unless-stopped

    environment:
      # Capa de datos D3: la cadena vive en .env (ignorado por git) para no
      # versionar la clave del pooler de Neon.
      APP_DATABASE_URL: ${APP_DATABASE_URL:?define APP_DATABASE_URL en .env}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET}
      # Clave de descifrado de PII (Ley 29733). Nunca se guarda en la base.
      APP_CRYPTO_KEY: ${APP_CRYPTO_KEY}
      NEXT_TELEMETRY_DISABLED: "1"
      # Docker Desktop en Windows no siempre propaga los eventos del sistema
      # de archivos al montaje; sondeando, la recarga en caliente sí funciona.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      TZ: ${TZ:-America/Lima}

    ports:
      - "${UI_PORT:-3000}:3000"

    volumes:
      - .:/app
      - avisa_node_modules:/app/node_modules
      - avisa_next_cache:/app/.next

volumes:
  avisa_pgdata:
    name: avisa_pgdata
  avisa_node_modules:
    name: avisa_node_modules
  avisa_next_cache:
    name: avisa_next_cache
